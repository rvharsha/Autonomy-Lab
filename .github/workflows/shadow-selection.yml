name: Shadow selection loop
on:
  pull_request:
    types: [opened]
    paths:
      - experiments/shadow_selection/**
      - .github/workflows/shadow-selection.yml
      - docs/SHADOW_SELECTION.md

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/shadow-improvement-loop' &&
      github.event.pull_request.base.sha == 'd72e72295b0770c71cbc464471989a7d299c2c22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse a repeated live attempt
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - run: .venv/bin/ruff check experiments
      - name: Fetch the digest-pinned historical training archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          destination = Path('artifacts/shadow-training')
          destination.mkdir(parents=True, exist_ok=False)
          spec = json.loads(Path('experiments/shadow_selection/training-artifacts.json').read_text())
          for artifact in spec['artifacts']:
              with (destination / (str(artifact['id']) + '.zip')).open('xb') as stream:
                  subprocess.run(['gh', 'api', '--allow-escape-sequences', f"repos/rvharsha/Autonomy-Lab/actions/artifacts/{artifact['id']}/zip"], stdout=stream, check=True, timeout=120)
          PYTHON
      - name: Reproduce historical evidence and freeze its selected update
        run: PYTHONPATH=src:scripts:. .venv/bin/python -m experiments.shadow_selection.run freeze artifacts/shadow-training artifacts/shadow-selection-plan
      - name: Retain original inputs alongside the frozen choice
        if: always()
        run: |
          mkdir -p artifacts/shadow-selection-plan/archives
          cp artifacts/shadow-training/*.zip artifacts/shadow-selection-plan/archives/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shadow-selection-plan
          path: |
            artifacts/shadow-selection-plan/plan.json
            artifacts/shadow-selection-plan/training/reproduction/reproduction.json
            artifacts/shadow-selection-plan/archives/*.zip
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Refuse a repeated live attempt
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shadow-selection-plan
          path: artifacts/shadow-selection-plan
      - name: Execute each frozen case once
        timeout-minutes: 30
        run: PYTHONPATH=src:scripts:. .venv/bin/python -m experiments.shadow_selection.run run artifacts/shadow-selection-plan/plan.json ${{ matrix.shard }} artifacts/shadow-selection-${{ matrix.shard }}
      - name: Retain credential-free evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-selection-shard-${{ matrix.shard }}
          path: |
            artifacts/shadow-selection-${{ matrix.shard }}/plan.json
            artifacts/shadow-selection-${{ matrix.shard }}/result.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/declaration.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/manifest.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/record.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/result.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/scorecard-*.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/evaluation-*.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/server-audit.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/contract.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/program-definition.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/window.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/source.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/identities-*.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/operations.sqlite
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/operations.sqlite-wal
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/operations.sqlite-shm
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/finished.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/failed.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/finalization.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/cleanup.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/samples/*.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/attempt.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/ready.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/finished.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/failed.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/escalation.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/preflight/*/*.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/intent/*/*.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/episode-*/*.json
            artifacts/shadow-selection-${{ matrix.shard }}/cases/*/campaign/workers/*/episode-*/evidence.jsonl
          if-no-files-found: error
          retention-days: 14
  reproduce-and-select:
    needs: [freeze, compare]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - run: .venv/bin/ruff check experiments
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shadow-selection-plan
          path: artifacts/shadow-selection-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: shadow-selection-shard-*
          path: artifacts/shadow-selection-download
      - name: Reproduce training and all nine executions before any benefit claim
        run: PYTHONPATH=src:scripts:. .venv/bin/python -m experiments.shadow_selection.run reproduce artifacts/shadow-selection-plan/plan.json artifacts/shadow-selection-download artifacts/shadow-selection-plan/archives artifacts/shadow-selection-selection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shadow-selection-selection
          path: artifacts/shadow-selection-selection/reproduction.json
          if-no-files-found: error
          retention-days: 14

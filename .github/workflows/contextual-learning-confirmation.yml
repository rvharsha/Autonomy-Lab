name: Contextual learning fresh confirmation
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: contextual-learning-confirmation-v1
  cancel-in-progress: false

jobs:
  freeze:
    if: >-
      github.event.label.name == 'contextual-learning-confirmation-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/contextual-learning' &&
      github.event.pull_request.base.sha == 'f3de4e84cc612fd24b359fdbda905b9dc4f6a6cf'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse repeated live attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = 1
      - name: Refuse another PR or workflow execution of this declared study
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          def get(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
          current = int(os.environ['CURRENT_RUN'])
          run = get(base + 'runs/' + str(current))
          runs = get(base + 'workflows/' + str(run['workflow_id']) + '/runs?branch=codex%2Fcontextual-learning&event=pull_request&per_page=100')
          assert runs['total_count'] <= 100 and current in [r['id'] for r in runs['workflow_runs']], 'Incomplete workflow history'
          for prior in runs['workflow_runs']:
              if prior['id'] == current:
                  continue
              jobs = get(base + 'runs/' + str(prior['id']) + '/jobs?per_page=100')['jobs']
              freeze = [j for j in jobs if j['name'] == 'freeze']
              assert len(freeze) == 1 and freeze[0]['conclusion'] == 'skipped', 'Earlier freeze/execution exists; automatic replacement refused'
          PYTHON
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - run: .venv/bin/ruff check experiments/contextual_learning
      - name: Verify exact frozen source and test the shared execution boundary
        run: |
          PYTHONPATH=src:. .venv/bin/python - <<'PYTHON'
          from experiments.experience_learning.evaluate import read
          from experiments.contextual_learning.protocol import DECLARATION, plan
          d = read(DECLARATION)
          assert d['plan'] == plan()
          PYTHON
          PYTHONPATH=src:. .venv/bin/python -m experiments.generated_policy.boundary artifacts/contextual-learning-boundary.json
          PYTHONPATH=src:. .venv/bin/python -m experiments.contextual_learning.workload artifacts/contextual-learning-workload.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contextual-learning-boundary
          path: |
            artifacts/contextual-learning-boundary.json
            artifacts/contextual-learning-workload.json
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse repeated live attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Execute one persistent block once, preserving failures
        timeout-minutes: 50
        run: PYTHONPATH=src:. .venv/bin/python -m experiments.contextual_learning.run run docs/validation/contextual-learning-confirmation/declaration.json ${{ matrix.block }} artifacts/contextual-learning-block-${{ matrix.block }}
      - name: Upload original and partial outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contextual-learning-block-${{ matrix.block }}
          path: artifacts/contextual-learning-block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 14
  reproduce:
    needs: [freeze, compare]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: contextual-learning-block-*
          path: artifacts/contextual-learning-download
      - name: Reconstruct every request and exercise copied-evidence corruptions
        run: PYTHONPATH=src:. .venv/bin/python -m experiments.contextual_learning.run reproduce docs/validation/contextual-learning-confirmation/declaration.json artifacts/contextual-learning-download artifacts/contextual-learning-reproduction
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contextual-learning-reproduction
          path: artifacts/contextual-learning-reproduction/reproduction.json
          if-no-files-found: error
          retention-days: 14

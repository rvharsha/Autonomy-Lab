name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-refresh:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Compare bounded refresh, continued contention and unknown effects
        run: PYTHONPATH=src .venv/bin/python scripts/check_refresh.py
      - name: Retain credential-free raw evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-refresh-results
          path: |
            artifacts/refresh-gate-*/declaration.json
            artifacts/refresh-gate-*/result.json
            artifacts/refresh-gate-*/*/declaration.json
            artifacts/refresh-gate-*/*/record.json
            artifacts/refresh-gate-*/*/result.json
            artifacts/refresh-gate-*/*/before-kill.json
            artifacts/refresh-gate-*/*/scorecard-*.json
            artifacts/refresh-gate-*/*/evaluation-*.json
            artifacts/refresh-gate-*/*/server-audit.json
            artifacts/refresh-gate-*/*/campaign/contract.json
            artifacts/refresh-gate-*/*/campaign/window.json
            artifacts/refresh-gate-*/*/campaign/source.json
            artifacts/refresh-gate-*/*/campaign/identities-*.json
            artifacts/refresh-gate-*/*/campaign/operations.sqlite
            artifacts/refresh-gate-*/*/campaign/finished.json
            artifacts/refresh-gate-*/*/campaign/failed.json
            artifacts/refresh-gate-*/*/campaign/finalization.json
            artifacts/refresh-gate-*/*/campaign/cleanup.json
            artifacts/refresh-gate-*/*/campaign/samples/*.json
            artifacts/refresh-gate-*/*/campaign/workers/*/attempt.json
            artifacts/refresh-gate-*/*/campaign/workers/*/ready.json
            artifacts/refresh-gate-*/*/campaign/workers/*/finished.json
            artifacts/refresh-gate-*/*/campaign/workers/*/failed.json
            artifacts/refresh-gate-*/*/campaign/workers/*/escalation.json
            artifacts/refresh-gate-*/*/campaign/workers/*/dispatch-barrier.json
            artifacts/refresh-gate-*/*/campaign/workers/*/preflight/*/*.json
            artifacts/refresh-gate-*/*/campaign/workers/*/episode-*/*.json
            artifacts/refresh-gate-*/*/campaign/workers/*/episode-*/evidence.jsonl
          if-no-files-found: warn
          retention-days: 14
  conditional-rejection:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Dispatch and independently verify a rejected conditional repair
        run: PYTHONPATH=src .venv/bin/python scripts/check_conflict.py
      - name: Retain credential-free raw evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conditional-rejection-results
          path: |
            artifacts/conflict-gate-*/declaration.json
            artifacts/conflict-gate-*/record.json
            artifacts/conflict-gate-*/result.json
            artifacts/conflict-gate-*/before-release.json
            artifacts/conflict-gate-*/scorecard-*.json
            artifacts/conflict-gate-*/evaluation-*.json
            artifacts/conflict-gate-*/server-audit.json
            artifacts/conflict-gate-*/campaign/contract.json
            artifacts/conflict-gate-*/campaign/window.json
            artifacts/conflict-gate-*/campaign/source.json
            artifacts/conflict-gate-*/campaign/identities-*.json
            artifacts/conflict-gate-*/campaign/operations.sqlite
            artifacts/conflict-gate-*/campaign/finished.json
            artifacts/conflict-gate-*/campaign/failed.json
            artifacts/conflict-gate-*/campaign/finalization.json
            artifacts/conflict-gate-*/campaign/cleanup.json
            artifacts/conflict-gate-*/campaign/samples/*.json
            artifacts/conflict-gate-*/campaign/workers/*/attempt.json
            artifacts/conflict-gate-*/campaign/workers/*/ready.json
            artifacts/conflict-gate-*/campaign/workers/*/finished.json
            artifacts/conflict-gate-*/campaign/workers/*/failed.json
            artifacts/conflict-gate-*/campaign/workers/*/escalation.json
            artifacts/conflict-gate-*/campaign/workers/*/preflight-*.json
            artifacts/conflict-gate-*/campaign/workers/*/episode-*/*.json
            artifacts/conflict-gate-*/campaign/workers/*/episode-*/evidence.jsonl
          if-no-files-found: warn
          retention-days: 14
  procedure-admission:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Calibrate admission and withdraw during real persistent episodes
        run: PYTHONPATH=src .venv/bin/python scripts/check_withdrawal.py --execute
      - name: Retain allowlisted calibration evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: procedure-admission-results
          path: |
            artifacts/procedure-gate-*/declaration.json
            artifacts/procedure-gate-*/result.json
            artifacts/procedure-gate-*/receipts.json
            artifacts/procedure-gate-*/admission.sqlite
            artifacts/experiment-*/manifest.json
            artifacts/experiment-*/release.json
            artifacts/experiment-*/accounting.json
            artifacts/experiment-*/cleanup.json
            artifacts/experiment-*/results.json
            artifacts/experiment-*/trial-*/trial.json
            artifacts/experiment-*/trial-*/worker-request.json
            artifacts/experiment-*/trial-*/operations.json
            artifacts/experiment-*/trial-*/final-verification.json
            artifacts/experiment-*/trial-*/evidence.jsonl
            artifacts/experiment-*/trial-*/server-audit.json
            artifacts/withdrawal-gate-*/declaration.json
            artifacts/withdrawal-gate-*/result.json
            artifacts/withdrawal-gate-*/*/declaration.json
            artifacts/withdrawal-gate-*/*/record.json
            artifacts/withdrawal-gate-*/*/result.json
            artifacts/withdrawal-gate-*/*/before-kill.json
            artifacts/withdrawal-gate-*/*/scorecard-*.json
            artifacts/withdrawal-gate-*/*/evaluation-*.json
            artifacts/withdrawal-gate-*/*/server-audit.json
            artifacts/withdrawal-gate-*/*/campaign/contract.json
            artifacts/withdrawal-gate-*/*/campaign/window.json
            artifacts/withdrawal-gate-*/*/campaign/source.json
            artifacts/withdrawal-gate-*/*/campaign/identities-*.json
            artifacts/withdrawal-gate-*/*/campaign/admission.json
            artifacts/withdrawal-gate-*/*/campaign/admission.sqlite
            artifacts/withdrawal-gate-*/*/campaign/operations.sqlite
            artifacts/withdrawal-gate-*/*/campaign/finished.json
            artifacts/withdrawal-gate-*/*/campaign/failed.json
            artifacts/withdrawal-gate-*/*/campaign/finalization.json
            artifacts/withdrawal-gate-*/*/campaign/cleanup.json
            artifacts/withdrawal-gate-*/*/campaign/samples/*.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/attempt.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/ready.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/finished.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/failed.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/escalation.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/*-barrier.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/finish-release.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/episode-*/*.json
            artifacts/withdrawal-gate-*/*/campaign/workers/*/episode-*/evidence.jsonl
          if-no-files-found: warn
          retention-days: 14
  telemetry-loss:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Preserve collection gaps and unavailable reconciliation
        run: PYTHONPATH=src .venv/bin/python scripts/check_telemetry.py
      - name: Retain credential-free telemetry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-loss-results
          path: |
            artifacts/telemetry-gate-*/declaration.json
            artifacts/telemetry-gate-*/result.json
            artifacts/telemetry-gate-*/record.json
            artifacts/telemetry-gate-*/before-kill.json
            artifacts/telemetry-gate-*/scorecard-*.json
            artifacts/telemetry-gate-*/evaluation-*.json
          if-no-files-found: warn
          retention-days: 14
  ambiguous-effects:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Interrupt real effects and reconcile across external change
        run: PYTHONPATH=src .venv/bin/python scripts/check_ambiguity.py
      - name: Retain credential-free ambiguity accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ambiguous-effects-results
          path: |
            artifacts/ambiguity-gate-*/declaration.json
            artifacts/ambiguity-gate-*/result.json
            artifacts/ambiguity-gate-*/*/declaration.json
            artifacts/ambiguity-gate-*/*/result.json
            artifacts/ambiguity-gate-*/*/record.json
            artifacts/ambiguity-gate-*/*/before-kill.json
            artifacts/ambiguity-gate-*/*/scorecard-*.json
            artifacts/ambiguity-gate-*/*/evaluation-*.json
          if-no-files-found: warn
          retention-days: 14
  recurring-incidents:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Recur across restarts and exhaust cumulative authority
        run: PYTHONPATH=src .venv/bin/python scripts/check_recurrence.py
      - name: Retain credential-free recurrence accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recurring-incidents-results
          path: |
            artifacts/recurrence-gate-*/declaration.json
            artifacts/recurrence-gate-*/result.json
            artifacts/recurrence-gate-*/scorecard-*.json
            artifacts/recurrence-gate-*/evaluation-*.json
            artifacts/recurrence-gate-*/incidents/*.json
          if-no-files-found: warn
          retention-days: 14
  persistent-campaign:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Keep one workload across an operator restart
        run: PYTHONPATH=src .venv/bin/python scripts/check_campaign.py
      - name: Retain credential-free campaign accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persistent-campaign-results
          path: |
            artifacts/campaign-gate-*/declaration.json
            artifacts/campaign-gate-*/result.json
            artifacts/campaign-gate-*/scorecard-*.json
          if-no-files-found: warn
          retention-days: 14
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - run: make test lint
  kubernetes-acceptance:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup demo
      - name: Execute model-free handoff and reproduce reports
        run: |
          PYTHONPATH=src .venv/bin/python scripts/run_evaluation.py scenarios/handoff-acceptance.yaml --execute
          .venv/bin/python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          ledgers = list(Path('artifacts').glob('evaluation-*/evaluation.json'))
          assert len(ledgers) == 1
          ledger = json.loads(ledgers[0].read_text())
          assert ledger['status'] == 'finished'
          run = Path(ledger['phases'][0]['run_dir'])
          results = json.loads((run / 'results.json').read_text())
          assert len(results) == 4
          assert {(r['scenario'], r['variant']) for r in results} == {
              ('routing', 'runbook'), ('routing', 'no_agent'),
              ('healthy', 'runbook'), ('healthy', 'no_agent')}
          for r in results:
              assert r['status'] == 'recorded'
              assert r['score']['environment_recovered'] is (r['scenario'] == 'healthy' or r['variant'] == 'runbook')
              assert r['execution_audit']['status'] == 'assessed'
              assert r['execution_audit']['successful_unmatched_mutations'] == 0
              assert not r['protected_state_damage']
          assert json.loads((run / 'cleanup.json').read_text())['status'] == 'deleted'
          for suffix in ['a', 'b']:
              subprocess.run(['.venv/bin/python', 'scripts/export_report.py', '--run', str(run),
                              '--output', 'artifacts/handoff-report-' + suffix], check=True)
          for name in ['report.json', 'REPORT.md']:
              assert (Path('artifacts/handoff-report-a') / name).read_bytes() == (Path('artifacts/handoff-report-b') / name).read_bytes()
          PY
          python3 scripts/export_report.py --published docs/validation/reliability-validation.json --output artifacts/published-reliability-report
          python3 scripts/export_report.py --published docs/validation/reconciliation-validation.json --output artifacts/published-reconciliation-report
      - name: Retain acceptance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kubernetes-acceptance-results
          path: |
            artifacts/demo-*/REPORT.md
            artifacts/demo-*/result.json
            artifacts/handoff-report-*/*
            artifacts/published-*-report/*
          if-no-files-found: warn
          retention-days: 14

name: Contention information gate
on:
  pull_request:
    paths:
      - 'src/autonomy_lab/**'
      - 'scripts/**'
      - 'scenarios/**'
      - 'procedures/**'
      - 'fixtures/**'
      - 'infra/**'
      - 'Dockerfile'
      - '*.lock'
      - 'pyproject.toml'
      - 'tests/test_information_gate.py'
      - 'tests/test_budget_horizon.py'
      - '.github/workflows/information-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - run: PYTHONPATH=src .venv/bin/python scripts/check_information_gate.py freeze artifacts/information-gate-plan/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: information-gate-plan
          path: artifacts/information-gate-plan/plan.json
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: information-gate-plan
          path: artifacts/information-gate-plan
      - name: Execute each frozen case once
        run: PYTHONPATH=src .venv/bin/python scripts/check_information_gate.py run artifacts/information-gate-plan/plan.json ${{ matrix.shard }} artifacts/information-gate-${{ matrix.shard }}
      - name: Retain credential-free evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: information-gate-shard-${{ matrix.shard }}
          path: |
            artifacts/information-gate-${{ matrix.shard }}/plan.json
            artifacts/information-gate-${{ matrix.shard }}/result.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/declaration.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/manifest.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/record.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/churn.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/result.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/scorecard-*.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/evaluation-*.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/server-audit.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/contract.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/program-definition.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/window.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/source.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/identities-*.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/operations.sqlite
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/finished.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/failed.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/finalization.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/cleanup.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/samples/*.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/workers/*/attempt.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/workers/*/ready.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/workers/*/finished.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/workers/*/failed.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/workers/*/escalation.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/workers/*/preflight/*/*.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/workers/*/episode-*/*.json
            artifacts/information-gate-${{ matrix.shard }}/cases/*/campaign/workers/*/episode-*/evidence.jsonl
          if-no-files-found: warn
          retention-days: 14
  reproduce-and-select:
    needs: [freeze, compare]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: information-gate-plan
          path: artifacts/information-gate-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: information-gate-shard-*
          path: artifacts/information-gate-download
      - name: Reproduce all twelve cases before selection
        run: PYTHONPATH=src .venv/bin/python scripts/check_information_gate.py reproduce artifacts/information-gate-plan/plan.json artifacts/information-gate-download artifacts/information-gate-selection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: information-gate-selection
          path: artifacts/information-gate-selection/reproduction.json
          if-no-files-found: warn
          retention-days: 14

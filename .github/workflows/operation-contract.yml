name: Operation contract feasibility
on:
  pull_request:
    paths:
      - 'src/autonomy_lab/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'infra/**'
      - 'Dockerfile'
      - '*.lock'
      - 'pyproject.toml'
      - 'tests/test_operation_contract.py'
      - 'docs/OPERATION_CONTRACT_GATE.md'
      - '.github/workflows/operation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - name: Execute all 30 frozen API cases once
        run: PYTHONPATH=src .venv/bin/python scripts/check_operation_contract.py run artifacts/operation-contract
      - name: Replay all retained observations
        if: always()
        run: PYTHONPATH=src .venv/bin/python scripts/check_operation_contract.py reproduce artifacts/operation-contract
      - name: Retain credential-free evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operation-contract-feasibility
          path: |
            artifacts/operation-contract/declaration.json
            artifacts/operation-contract/result.json
            artifacts/operation-contract/cleanup.json
            artifacts/operation-contract/evaluation.json
            artifacts/operation-contract/server-audit.json
            artifacts/operation-contract/*/record.json
          if-no-files-found: error
          retention-days: 14

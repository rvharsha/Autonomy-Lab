name: Learning settlement and opportunity
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  group: learning-opportunity-v1
  cancel-in-progress: false
jobs:
  freeze:
    if: >-
      github.event.label.name == 'learning-opportunity-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/learning-settlement' &&
      github.event.pull_request.base.sha == '1b110e23e9a09a81c99a36026ad7c4eb6bcb4c49'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: lab-test-only
          POSTGRES_DB: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lab"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SETTLEMENT_DATABASE_ADMIN_URL: postgresql://postgres:lab-test-only@127.0.0.1:5432/lab
    steps:
      - name: Refuse repeated live attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = 1
      - name: Refuse another PR or workflow execution of this declared study
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          def get(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
          current = int(os.environ['CURRENT_RUN'])
          run = get(base + 'runs/' + str(current))
          runs = get(base + 'workflows/' + str(run['workflow_id']) + '/runs?branch=codex%2Flearning-settlement&event=pull_request&per_page=100')
          assert runs['total_count'] <= 100 and current in [r['id'] for r in runs['workflow_runs']], 'Incomplete workflow history'
          for prior in runs['workflow_runs']:
              if prior['id'] == current:
                  continue
              jobs = get(base + 'runs/' + str(prior['id']) + '/jobs?per_page=100')['jobs']
              freeze = [j for j in jobs if j['name'] == 'freeze']
              assert len(freeze) == 1 and freeze[0]['conclusion'] == 'skipped', 'Earlier freeze/execution exists; automatic replacement refused'
          PYTHON
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - run: .venv/bin/ruff check experiments/request_settlement tests/test_request_settlement.py
      - name: Check exact frozen source before real engineering probes
        run: |
          PYTHONPATH=src:. .venv/bin/python - <<'PYTHON'
          import json
          from experiments.request_settlement.opportunity import plan
          d=json.load(open('docs/validation/learning-opportunity/declaration.json'))
          assert d['plan']==plan()
          PYTHON
          PYTHONPATH=src:. .venv/bin/python -m experiments.request_settlement.probe artifacts/settlement-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: settlement-probe
          path: artifacts/settlement-probe/result.json
          if-no-files-found: error
          retention-days: 14
  calibrate:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1]
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: lab-test-only
          POSTGRES_DB: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lab"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SETTLEMENT_DATABASE_ADMIN_URL: postgresql://postgres:lab-test-only@127.0.0.1:5432/lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - name: Refuse repeated attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = 1
      - name: Run original development block once
        run: PYTHONPATH=src:. .venv/bin/python -m experiments.request_settlement.opportunity run docs/validation/learning-opportunity/declaration.json ${{ matrix.block }} artifacts/opportunity-${{ matrix.block }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opportunity-${{ matrix.block }}
          path: artifacts/opportunity-${{ matrix.block }}/*.json
          if-no-files-found: error
          retention-days: 14
  audit:
    needs: [freeze, calibrate]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: opportunity-*
          path: artifacts/original
      - name: Reconstruct original HTTP outcomes and settlement receipts
        run: PYTHONPATH=src:. .venv/bin/python -m experiments.request_settlement.opportunity audit docs/validation/learning-opportunity/declaration.json artifacts/original artifacts/opportunity-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opportunity-audit
          path: artifacts/opportunity-audit.json
          if-no-files-found: error
          retention-days: 14

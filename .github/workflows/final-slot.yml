name: Final-slot confirmation
on:
  pull_request:
    types: [opened]
    paths:
      - experiments/final_slot/**
      - .github/workflows/final-slot.yml
      - docs/FINAL_SLOT_CONFIRMATION_GATE.md
      - docs/validation/final-slot-novelty.json

permissions:
  contents: read

jobs:
  freeze:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/final-slot-confirmation' &&
      github.event.pull_request.base.sha == 'b751905de27d2ae9e4de70763d392a7dd61c3fab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse a repeated live attempt
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - run: .venv/bin/ruff check experiments
      - run: PYTHONPATH=src:scripts:. .venv/bin/python -m experiments.final_slot.run freeze artifacts/final-slot-plan/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-slot-plan
          path: artifacts/final-slot-plan/plan.json
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Refuse a repeated live attempt
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: make setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: final-slot-plan
          path: artifacts/final-slot-plan
      - name: Execute each frozen case once
        timeout-minutes: 25
        run: PYTHONPATH=src:scripts:. .venv/bin/python -m experiments.final_slot.run run artifacts/final-slot-plan/plan.json ${{ matrix.shard }} artifacts/final-slot-${{ matrix.shard }}
      - name: Retain credential-free evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-slot-shard-${{ matrix.shard }}
          path: |
            artifacts/final-slot-${{ matrix.shard }}/plan.json
            artifacts/final-slot-${{ matrix.shard }}/result.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/declaration.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/manifest.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/record.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/result.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/scorecard-*.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/evaluation-*.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/server-audit.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/contract.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/program-definition.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/window.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/source.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/identities-*.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/operations.sqlite
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/operations.sqlite-wal
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/operations.sqlite-shm
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/finished.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/failed.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/finalization.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/cleanup.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/samples/*.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/attempt.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/ready.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/finished.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/failed.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/escalation.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/preflight/*/*.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/intent/*/*.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/episode-*/*.json
            artifacts/final-slot-${{ matrix.shard }}/cases/*/campaign/workers/*/episode-*/evidence.jsonl
          if-no-files-found: error
          retention-days: 14
  reproduce-and-select:
    needs: [freeze, compare]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
      - run: uv sync --frozen
      - run: .venv/bin/ruff check experiments
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: final-slot-plan
          path: artifacts/final-slot-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: final-slot-shard-*
          path: artifacts/final-slot-download
      - name: Reproduce all six cases and challenge their evidence before selection
        run: PYTHONPATH=src:scripts:. .venv/bin/python -m experiments.final_slot.run reproduce artifacts/final-slot-plan/plan.json artifacts/final-slot-download artifacts/final-slot-selection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: final-slot-selection
          path: artifacts/final-slot-selection/reproduction.json
          if-no-files-found: error
          retention-days: 14
